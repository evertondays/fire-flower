# Imagem Docker em ghcr.io/evertondays/fire-flower, para amd64 e arm64.
#
# - push na main      → tag `main`
# - tag vX.Y.Z         → tags `X.Y.Z`, `X.Y` e `latest`
# - pull request       → só compila e testa, sem publicar
#
# Cada arquitetura compila num runner nativo (sem emulação: o RocksDB em C++
# levaria quase uma hora no QEMU), publica a imagem só pelo digest e, no fim,
# o job `merge` junta as duas numa imagem multiarquitetura com as tags.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Nome da plataforma
        run: |
          platform=${{ matrix.platform }}
          echo "PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # O cache por plataforma guarda a camada das dependências: o RocksDB só
      # é recompilado quando o Cargo.lock muda.
      - name: Compila (e publica pelo digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ env.PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PAIR }}

      # Mesma compilação (vem do cache local do builder), carregada no Docker para
      # indexar e buscar de verdade antes de qualquer tag ser movida.
      - name: Teste rápido
        run: |
          docker buildx build --load -t fire-flower:test .
          mkdir -p t/docs
          echo 'O Coração do Brasil bate forte.' > t/docs/brasil.txt
          echo '{"id": 1, "title": "Planeta Terra", "text": "O terceiro planeta."}' > t/artigos.jsonl
          echo '{"external_id": "https://exemplo.com/marte", "title": "Planeta Marte", "text": "O quarto planeta."}' >> t/artigos.jsonl
          run() { docker run --rm -v "$PWD/t:/data" --user "$(id -u):$(id -g)" fire-flower:test "$@"; }
          run index banco docs
          run search banco 'coração bras*' | tee /dev/stderr | grep -q 'docs/brasil.txt'
          run suggest banco bra | grep -qx 'brasil'
          run index-jsonl wiki artigos.jsonl
          run search wiki planeta | grep -q 'Planeta Terra'
          run search wiki marte | grep -q 'https://exemplo.com/marte'
          run delete wiki 1 | grep -q '^1 documento'
          run delete wiki --external-ids https://exemplo.com/marte | grep -q '^1 documento'
          run search wiki planeta | tee /dev/stderr | grep -q '^0 resultado'

      - name: Guarda o digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Junta as arquiteturas e aplica as tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Confere a imagem
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
