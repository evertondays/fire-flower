[package]
name = "fire-flower"
version = "0.1.0"
edition = "2024"
description = "Motor de busca full-text embutido: Trie persistida no RocksDB"

[dependencies]
rocksdb = { version = "0.23", default-features = false, features = ["lz4", "bindgen-runtime"] }
unicode-normalization = "0.1"
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2.1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "micro"
harness = false

[profile.release]
debug = false

# Release com símbolos, só para profiling (samply, heaptrack). Não altera o release.
[profile.profiling]
inherits = "release"
debug = true
