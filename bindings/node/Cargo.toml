[package]
name = "fire-flower-node"
version.workspace = true
edition.workspace = true
description = "Binding Node.js (napi-rs) do fire-flower"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["metrics"]
metrics = ["fire-flower/metrics"]

[dependencies]
fire-flower.workspace = true
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
